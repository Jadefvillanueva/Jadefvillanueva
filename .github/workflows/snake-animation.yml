name: Generate contribution snake

on:
  schedule:
    # Run every 1 hour
    - cron: "0 */1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

# Needed so the workflow can push to the output branch (especially on schedule events)
permissions:
  contents: write

concurrency:
  group: snake-animation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Generates the snake animation SVGs (light and dark)
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          # Your GitHub username
          github_user_name: ${{ github.repository_owner }}

          # Output files (v3 uses the `outputs` parameter)
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Pushes the generated SVGs to the 'output' branch
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          commit_message: "chore: update snake animation [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
