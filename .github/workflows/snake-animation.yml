
# This Action will:
# - Run every 1 hours AND when you push to the 'main' or 'master' branch.
# - Generate the snake SVG file.
# - Push the generated file to a branch named 'output'.
#
# The README.md file will then load the image from that 'output' branch.

name: Generate contribution snake

on:
  schedule:
    # Run every 1 hours
    - cron: "0 */1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Generates the snake animation SVG
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          # Your GitHub username
          github_user_name: ${{ github.repository_owner }}
          
          # The output file
          svg_out_path: dist/github-contribution-grid-snake.svg
          
          # You can customize the colors here!
          # Example: ?color_snake=purple&color_dots=#bfd6f6
          # color_snake=...
          # color_dots=...

      # Pushes the generated SVG to the 'output' branch
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
